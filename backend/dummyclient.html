        async function upload_encrypt(e){
            const publicKey = await openpgp.readKey({
                armoredKey: public_key_armored
            })
            const message = await openpgp.createMessage({
                binary: new Uint8Array(await file_ipt.files[0].arrayBuffer())
            })
            const encrypted = await openpgp.encrypt({
                message,
                encryptionKeys: publicKey,
                format: 'binary'
            })
            const fd = new FormData()
            fd.append('upload_zip_pgp', new Blob([encrypted.buffer]))
            fetch(`/salsa/device/api/upload-response-file?response_code=${response_code.value}`, {
                method: 'POST',
                body: fd,
            }).then(r => {console.log('upload'); e.preventDefault()})
        }
        upload_form.addEventListener('submit', async(e) => {e.preventDefault(); await upload_encrypt(e)})
